[project]
name = "calandria"
version = "2.4.5"
description = "Calandria — offline Word (.docx) redline / compare tool with a paged viewer and PDF output"
readme = "README.md"
authors = [
    { name = "King-of-Heck", email = "39289801+King-of-Heck@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1",
    "fpdf2>=2.8",
    "fonttools>=4.62",
    "pillow>=12",
]

[dependency-groups]
dev = [
    "pypdf>=6.18.0",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
